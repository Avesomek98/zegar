<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Licznik Godzin Pracy</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90d9">

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Godziny Pracy">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>⏰ Licznik Godzin Pracy</h1>

    <button id="startBtn">▶ Rozpocznij pracę</button>
    <button id="stopBtn">■ Zakończ pracę</button>

    <p id="status">Nie pracujesz.</p>

    <h2>Historia</h2>
    <ul id="history"></ul>
</div>

<script type="module" src="script.js"></script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("sw.js");
        });
    }
</script>
</body>
</html>
